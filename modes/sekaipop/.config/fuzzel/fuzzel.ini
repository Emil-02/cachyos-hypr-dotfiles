# sekaipop: managed block, removed by Settings -> Desktop -> App colours (revert)
include=@HOME@/.config/fuzzel/sekaipop-colors.ini
font=JetBrains Mono NF:size=17
terminal=foot -e
prompt="> "
layer=overlay
lines=15
width=60
dpi-aware=no
inner-pad=10
horizontal-pad=40
vertical-pad=15
match-counter=yes

[border]
radius=10
width=2
