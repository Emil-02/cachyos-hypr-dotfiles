# Written by SekaiPop: Settings > General > Idle & sleep (services/IdleService.qml).
# Edits here are replaced the next time the times change; set them there, or with
#   qs -c sekaipop ipc call options set idle.lock 10      (minutes, 0 = never)
# hypridle.conf reads this file with `source =`.

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900
    on-timeout = systemctl suspend || loginctl suspend
}
